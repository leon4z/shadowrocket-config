name: build

# 源数据或生成逻辑变化后校验发布；不与每日名单生成并行抢跑。
# 校验失败不会发布，release 分支保持上一版可用。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 运行生成器单测
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: 校验远程规则集并生成配置
        run: python3 scripts/build.py --require-fresh-selection --report dist/report.json

      - name: 渲染 Karing 分流分组
        run: python3 scripts/render_karing.py

      - name: 写入运行摘要
        if: always()
        run: python3 scripts/summary.py dist/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: 准备 release 提交
        id: prepare_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A queued older build must never overwrite a newer source revision.
          current_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "源分支已有更新，跳过过期构建的发布"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -B - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import build
          build.check_selection_freshness(build.load_selection(build.load_spec()))
          PY
          OUT="$RUNNER_TEMP/publish"
          mkdir -p "$OUT"
          cd "$OUT"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if git fetch -q --depth 1 origin release:refs/remotes/origin/release 2>/dev/null; then
            git checkout -q -b release refs/remotes/origin/release
          else
            git checkout -q --orphan release
            git rm -rq --cached . 2>/dev/null || true
          fi

          # 先清掉上一版的产物，避免改过文件名后旧文件留在 release 分支上
          rm -f ./*.conf
          rm -rf ./karing
          cp "$GITHUB_WORKSPACE"/dist/*.conf ./
          cp -R "$GITHUB_WORKSPACE"/dist/karing ./karing
          git add -A

          if git diff --cached --quiet; then
            echo "配置无变化，跳过发布（上游与规格都没变）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -q -m "build: $(date -u +%Y-%m-%dT%H:%M:%SZ) 上游 $(date -u +%Y-%m-%d) 校验 ${GITHUB_SHA::7}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 推送 release 分支
        if: steps.prepare_release.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publish"
          local_sha=$(git rev-parse HEAD)
          parent_sha=$(git rev-parse refs/remotes/origin/release 2>/dev/null || true)
          for attempt in 1 2 3; do
            current_head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$current_head" != "$GITHUB_SHA" ]; then
              echo "源分支已有更新，跳过过期构建的发布"
              exit 0
            fi
            if remote_ref=$(git ls-remote origin refs/heads/release); then
              remote_sha=${remote_ref%%$'\t'*}
              if [ "$remote_sha" = "$local_sha" ]; then
                echo "release 已包含本次提交"
                exit 0
              fi
              if [ "$remote_sha" != "$parent_sha" ]; then
                echo "release 已被其他提交推进，停止发布"
                exit 1
              fi
              if git push -q origin HEAD:refs/heads/release; then
                echo "已发布到 release 分支"
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((5 * attempt * attempt))
            fi
          done
          # 推送响应丢失时，先确认远端是否实际接收了提交。
          remote_ref=$(git ls-remote origin refs/heads/release)
          remote_sha=${remote_ref%%$'\t'*}
          if [ "$remote_sha" = "$local_sha" ]; then
            echo "release 已包含本次提交"
            exit 0
          fi
          echo "release 推送失败，保留上一版"
          exit 1

      - name: 列出 release 产物
        if: steps.prepare_release.outputs.changed == 'true'
        run: |
          cd "$RUNNER_TEMP/publish"
          ls -1 ./*.conf
          echo "karing/ 下 $(ls -1 ./karing/ruleset/*.json | wc -l | tr -d ' ') 个规则集"

      - name: 清理 jsDelivr 缓存
        # jsDelivr 对分支引用有缓存，不清的话镜像最长可能滞后十几小时。
        # 清失败不影响发布（raw 地址本来就不经过它）。
        run: |
          set -uo pipefail
          ok=0; fail=0
          for f in "$GITHUB_WORKSPACE"/dist/*.conf "$GITHUB_WORKSPACE"/dist/karing/*.json "$GITHUB_WORKSPACE"/dist/karing/ruleset/*.json; do
            rel="${f#"$GITHUB_WORKSPACE"/dist/}"
            if curl -sf --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${rel}" -o /dev/null; then
              ok=$((ok+1))
            else
              fail=$((fail+1))
            fi
          done
          echo "已清理 jsDelivr 缓存 $ok 个，失败 $fail 个（失败不影响发布）"
